<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <title>메이플랜드 퀴즈</title>
    <link rel="stylesheet" href="../css/page-transition.css">
    <script src="../js/page-enter.js"></script>
</head>

<body>
    <main class="stage-wrap">

        <!-- 시작 화면 -->
        <section class="screen" id="screen-start">
            <div class="panel">
                <h1 class="title">메이플랜드 퀴즈</h1>
                <p class="lead">NPC 이미지를 보고 이름을 맞혀보세요!</p>
                <ul class="rules">
                    <li><b id="rule-count">50</b>문제 출제</li>
                    <li>문제당 <b id="rule-time">10</b>초 제한</li>
                    <li>공백·대소문자는 무시돼요</li>
                </ul>
                <button type="button" class="btn btn-primary btn-block" id="start">시작하기</button>
                <a class="btn btn-outline btn-block" href="./npc_list.html"><span class="btn-ico">📖</span>족보 보기</a>
            </div>
        </section>

        <!-- 퀴즈 화면 -->
        <section class="screen is-hidden" id="screen-quiz">
            <div class="panel">
                <div class="hud">
                    <span class="hud-progress" id="now">0 / 50</span>
                    <span class="hud-score">★ 정답 <b id="score">0</b></span>
                </div>

                <div class="timerbar">
                    <div class="timerbar-fill" id="timerbar"></div>
                    <span class="timerbar-text"><span id="timer">10</span>초</span>
                </div>

                <div class="stage">
                    <img src="" id="random_img" alt="NPC" class="npc-img">
                </div>

                <input type="text" id="answer" class="answer-input" placeholder="NPC 이름 입력"
                    autocomplete="off" autocapitalize="off" spellcheck="false">

                <div class="actions">
                    <button type="button" class="btn btn-skip" id="skip">통과</button>
                    <button type="button" class="btn btn-confirm" id="next">확인</button>
                </div>

                <button type="button" class="btn btn-ghost" id="reset">처음으로</button>
            </div>
        </section>

        <!-- 결과 화면 -->
        <section class="screen is-hidden" id="screen-result">
            <div class="panel">
                <h2 class="title">결과</h2>
                <div class="result-score">
                    <b id="result-score">0</b><span class="result-slash">/</span><span id="result-total">50</span>
                </div>
                <p class="result-msg" id="result-msg"></p>

                <div class="result-list" id="result-list"></div>

                <button type="button" class="btn btn-primary btn-block" id="retry">다시하기</button>
                <a class="btn btn-outline btn-block" href="./npc_list.html"><span class="btn-ico">📖</span>족보 보기</a>
            </div>
        </section>

    </main>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
